<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Than Bannarat is a Computer Science student at Arizona State University with experience in software development, accessibility, LLM research, and personal AI projects.">
  <meta name="theme-color" content="#fff9f4">
  <title>Than Bannarat — Computer Science Portfolio</title>
  <style>
    :root {
      color-scheme: light;
      --background: #fff9f4;
      --surface: #fffefd;
      --surface-alt: #fff0e3;
      --text: #29252e;
      --muted: #665e68;
      --accent: #a64534;
      --accent-dark: #83382a;
      --line: #eadbd3;
      --shadow: 0 14px 38px rgba(74, 44, 40, .075);
      --hero-light: #ffe8d8;
      --badge-bg: #fae5dc;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --background: #1d1a23;
      --surface: #282530;
      --surface-alt: #362b30;
      --text: #fbf0e9;
      --muted: #c9bbb8;
      --accent: #ffb599;
      --accent-dark: #ffd2bd;
      --line: #4a4149;
      --shadow: 0 14px 38px rgba(0, 0, 0, .24);
      --hero-light: #392c32;
      --badge-bg: #3d3033;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--background); color: var(--text); font: 16px/1.64 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    a { color: inherit; }
    button { font: inherit; }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    [hidden] { display: none !important; }
    .skip-link { position: absolute; top: -100px; left: 18px; z-index: 100; padding: 10px 15px; background: var(--surface); color: var(--text); }
    .skip-link:focus { top: 12px; }
    .shell { width: min(100% - 48px, 1140px); margin-inline: auto; }
    .topbar { position: sticky; top: 0; z-index: 20; background: var(--background); border-bottom: 1px solid var(--line); }
    .nav-inner { min-height: 76px; display: flex; align-items: center; gap: 22px; }
    .brand { font-weight: 850; font-size: 1.17rem; text-decoration: none; letter-spacing: -.05em; white-space: nowrap; margin-right: auto; }
    .brand span { color: var(--accent); }
    nav { display: flex; gap: clamp(9px, 1.65vw, 22px); align-items: center; }
    nav a { text-decoration: none; color: var(--muted); font-weight: 650; font-size: .87rem; white-space: nowrap; }
    nav a:hover { color: var(--accent); }
    .theme-button { cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: 100px; padding: 8px 12px; color: var(--text); font-weight: 750; font-size: .83rem; white-space: nowrap; }
    .theme-button:hover { background: var(--surface-alt); }
    .hero { padding: 85px 0 68px; display: grid; grid-template-columns: 1.18fr .82fr; gap: 65px; align-items: center; }
    .eyebrow { color: var(--accent-dark); font-size: .78rem; text-transform: uppercase; letter-spacing: .13em; font-weight: 850; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(2.8rem, 5.6vw, 5rem); line-height: 1.075; letter-spacing: -.065em; margin: 17px 0 20px; }
    h1 em { font-style: normal; color: var(--accent); }
    .lead { max-width: 640px; font-size: 1.12rem; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 25px; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 12px; text-decoration: none; font-size: .94rem; font-weight: 750; transition: transform .15s ease; }
    .button:hover { transform: translateY(-2px); }
    .button-primary { background: var(--accent); color: var(--background); }
    .button-secondary { background: var(--surface); border: 1px solid var(--line); }
    .hero-card { padding: 25px; border: 1px solid var(--line); border-radius: 24px; background: var(--surface); box-shadow: var(--shadow); }
    .profile-art { background: linear-gradient(130deg, #ffe6d4, #f3ac91); color: #783a30; border-radius: 18px; aspect-ratio: 1.4; display: grid; place-items: center; font-size: clamp(3.4rem, 9vw, 5.7rem); letter-spacing: -.09em; font-weight: 850; }
    .hero-card .card-label { margin: 17px 0 3px; color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .11em; font-weight: 850; }
    .hero-card h2 { font-size: 1.18rem; letter-spacing: -.025em; margin: 0 0 6px; }
    .hero-card p:last-child { color: var(--muted); font-size: .9rem; margin: 0; }
    .mini-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .mini-pill { padding: 7px 12px; background: var(--badge-bg); border: 1px solid var(--line); border-radius: 99px; font-size: .8rem; font-weight: 750; }
    .section { scroll-margin-top: 110px; padding: 42px 0 58px; }
    .section-head { max-width: 800px; margin-bottom: 25px; }
    .section h2 { font-size: clamp(2rem, 4vw, 2.6rem); letter-spacing: -.045em; line-height: 1.16; margin: 8px 0 12px; }
    .section-description { color: var(--muted); }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 30px; box-shadow: var(--shadow); }
    .panel p:last-child { margin-bottom: 0; }
    .about-grid { display: grid; grid-template-columns: 1.36fr .64fr; gap: 22px; }
    .quick-facts { padding: 25px; border-radius: 20px; background: var(--surface-alt); border: 1px solid var(--line); }
    .fact { padding-bottom: 13px; margin-bottom: 13px; border-bottom: 1px solid var(--line); }
    .fact:last-child { border: 0; padding: 0; margin: 0; }
    .fact small { display: block; color: var(--muted); font-size: .78rem; }
    .fact strong { font-size: .91rem; }
    .skill-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .skill-group { padding: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
    .skill-group h3 { font-size: 1rem; margin-bottom: 16px; }
    .skill-list { display: flex; flex-wrap: wrap; gap: 9px; }
    .skill { padding: 7px 12px; background: var(--surface-alt); border: 1px solid var(--line); border-radius: 99px; font-weight: 700; font-size: .83rem; }
    .filters { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 22px; }
    .filter-button { cursor: pointer; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 9px 16px; font-size: .88rem; font-weight: 700; }
    .filter-button[aria-pressed="true"] { background: var(--accent); color: var(--background); border-color: var(--accent); }
    .projects-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 21px; }
    .project-card { display: flex; flex-direction: column; overflow: hidden; border-radius: 19px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .project-banner { min-height: 125px; display: flex; align-items: flex-end; padding: 21px 25px; background: linear-gradient(135deg, #ffc8ae, #ffefdf); color: #603a32; font-size: clamp(1.3rem, 2.4vw, 1.72rem); font-weight: 850; letter-spacing: -.04em; }
    .project-banner.violet { background: linear-gradient(135deg, #e3d6ed, #fff1e6); color: #4d3c5a; }
    .project-banner.sage { background: linear-gradient(135deg, #d8ebdb, #fff2e4); color: #395345; }
    .project-banner.blue { background: linear-gradient(135deg, #dbe9f5, #fbe9e7); color: #344c66; }
    .project-banner.cream { background: linear-gradient(135deg, #fce5be, #fff1e0); color: #67482c; }
    .project-banner.gray { background: linear-gradient(135deg, #e1e1eb, #f7ece5); color: #464454; }
    .project-body { padding: 24px 26px 25px; display: flex; flex-direction: column; flex: 1; }
    .status { align-self: flex-start; margin-bottom: 13px; padding: 5px 10px; border-radius: 99px; background: var(--surface-alt); color: var(--accent-dark); text-transform: uppercase; letter-spacing: .07em; font-weight: 800; font-size: .7rem; }
    .project-body h3 { font-size: 1.22rem; margin: 0 0 9px; }
    .project-body p { color: var(--muted); font-size: .93rem; }
    .project-meta { margin-top: auto; font-size: .78rem; font-weight: 750; color: var(--muted); }
    .project-link { display: inline-block; color: var(--accent-dark); font-weight: 750; text-underline-offset: 4px; margin-top: 13px; }
    .project-link:hover { color: var(--accent); }
    .timeline { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .timeline-item { background: var(--surface); border: 1px solid var(--line); border-radius: 19px; padding: 26px; }
    .timeline-item small { color: var(--accent-dark); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
    .timeline-item h3 { margin: 10px 0 7px; font-size: 1.13rem; }
    .timeline-item p { color: var(--muted); margin: 0; font-size: .94rem; }
    .timeline-item .date { color: var(--muted); font-size: .83rem; margin-bottom: 12px; }
    .interests-panel { display: flex; align-items: center; gap: 25px; }
    .camera-icon { width: 88px; height: 88px; flex: 0 0 auto; border-radius: 18px; background: var(--surface-alt); display: grid; place-items: center; font-size: 2.4rem; }
    .interests-panel p { color: var(--muted); margin: 0; }
    .photography-intro { flex: 1; }
    .photography-cta { margin-top: 17px; }
    .contact-panel { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .contact-panel h3 { margin-bottom: 7px; }
    .contact-panel p { color: var(--muted); margin: 0; }
    .footer { margin-top: 20px; padding: 26px 0 42px; border-top: 1px solid var(--line); font-size: .84rem; color: var(--muted); }
    .footer-inner { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px; }
    @media (max-width: 1000px) { .nav-inner { flex-wrap: wrap; padding: 12px 0; row-gap: 8px; } nav { order: 3; flex-basis: 100%; gap: 18px; overflow-x: auto; padding-bottom: 4px; } .hero { gap: 25px; } }
    @media (max-width: 770px) { .hero { grid-template-columns: 1fr; padding: 60px 0 42px; } .hero-card { max-width: 500px; } .about-grid, .projects-grid, .timeline { grid-template-columns: 1fr; } .skill-grid { grid-template-columns: 1fr; } .contact-panel { align-items: flex-start; flex-direction: column; } }
    @media (max-width: 520px) { .shell { width: min(100% - 36px, 1140px); } nav { gap: 8px 14px; flex-wrap: wrap; overflow: visible; } nav a { font-size: .8rem; } .hero { padding-top: 42px; } .section { padding-bottom: 38px; } .panel { padding: 22px; } .interests-panel { flex-direction: column; align-items: flex-start; } }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .button { transition: none; } }

    .multiline { white-space: pre-line; }
    .project-card { cursor:pointer; transition:transform .15s ease,box-shadow .15s ease; }
    .project-card:hover { transform:translateY(-3px); box-shadow:0 17px 38px #4b28221f; }
    .project-open { cursor:pointer; text-align:left; border:0; background:transparent; padding:9px 0 0; color:var(--accent-dark); font-size:.94rem; font-weight:800; text-decoration:underline; text-underline-offset:4px; margin-top:13px; }
    .project-open:hover { color:var(--accent); }
    .project-dialog { width:min(620px,calc(100% - 32px)); max-height:min(84vh,900px); color:var(--text); background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:32px; box-shadow:0 18px 95px #0006; }
    .project-dialog::backdrop { background:rgba(21,16,24,.7); }
    .project-dialog h2 { font-size:clamp(1.5rem,4vw,2.1rem); line-height:1.16; margin:14px 0 7px; }
    .project-dialog h3 { margin:22px 0 6px; }
    .project-dialog p { color:var(--muted); }
    .project-dialog .project-dialog-sub { font-size:.85rem; }
    .project-dialog { width:min(880px,calc(100% - 26px)); max-height:min(92vh,1040px); padding:0; overflow-y:auto; }
    .project-dialog-inner { padding:22px 34px 38px; }
    .project-header { padding-top:10px; }
    .project-dialog-intro { font-size:1rem; line-height:1.7; }
    .project-media { margin:25px 0 20px; }
    .project-image-stage { display:grid;place-items:center;min-height:180px;background:var(--surface-alt);border:1px solid var(--line);border-radius:15px;overflow:hidden; }
    .project-image-stage img { display:block;max-height:440px;width:100%;object-fit:contain; }
    .project-image-toolbar { display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.85rem;color:var(--muted);margin:9px 4px 0; }
    #project-image-count { white-space:nowrap; }
    .project-gallery-controls { display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px; }
    .project-gallery-controls button { cursor:pointer;border-radius:9px;border:1px solid var(--line);background:var(--surface-alt);color:var(--text);padding:7px 11px; }
    .project-image-dots { display:flex;gap:5px;overflow:auto;max-width:60%; }
    .project-image-dots button { min-width:30px;padding:5px; }
    .project-image-dots button[aria-pressed="true"] { background:var(--accent);border-color:var(--accent);color:#fff; }
    .project-facts { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:19px 0; }
    .project-facts>div { background:var(--surface-alt);border:1px solid var(--line);border-radius:12px;padding:12px 14px; }
    .project-facts small { display:block;color:var(--muted);font-size:.74rem;margin-bottom:5px; }
    .project-facts strong { display:block;font-size:.93rem;overflow-wrap:anywhere; }
    .project-block { margin-top:20px; }
    .project-block h3 { margin-bottom:10px; }
    .project-highlights { padding-left:22px;line-height:1.75;color:var(--muted); }
    .project-links { border-top:1px solid var(--line);padding-top:20px;margin-top:24px; }
    .dialog-close { position:sticky;top:0;z-index:3;float:right;margin:13px 16px 0 0; }
    @media (max-width:700px) { .project-dialog { padding:0; } .project-dialog-inner { padding:20px; } .project-facts { grid-template-columns:1fr; } .project-image-stage img { max-height:300px; } }
    .dialog-close { display:block; margin-left:auto; border:1px solid var(--line); color:var(--text); background:var(--surface-alt); padding:8px 12px; border-radius:12px; cursor:pointer; }
    @media (max-width:700px) { .project-dialog { padding:22px; } }
    /* V11 responsive refinements */
    .project-card,.panel,.skill-group{min-width:0;overflow-wrap:anywhere}
    .project-dialog{overscroll-behavior:contain}
    .project-image-stage img{height:auto;max-width:100%}
    .project-gallery-controls button{min-height:44px;touch-action:manipulation}
    @media(max-width:520px){.project-dialog{width:calc(100% - 12px);max-height:94dvh;padding:0}.project-dialog-inner{padding:16px 18px 30px}.project-gallery-controls{flex-wrap:wrap;gap:8px}.project-image-dots{order:3;width:100%;max-width:none;justify-content:center}.project-dialog .project-header h2{font-size:clamp(1.5rem,6vw,2.2rem)}}
  </style>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div class="topbar">
    <div class="shell nav-inner">
      <a class="brand" href="#home" aria-label="Than Bannarat, back to top">than<span>.</span></a>
      <nav id="main-nav" aria-label="Main navigation">
        <a href="photography.html">Photography ↗</a>
      </nav>
      <button class="theme-button" id="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">☾ Dark mode</button>
    </div>
  </div>

  <main id="main"><div class="shell section">Loading portfolio…</div></main>
  <dialog id="project-modal" class="project-dialog" aria-labelledby="project-dialog-title"><button id="project-close" class="dialog-close" type="button" aria-label="Close project details">✕ Close</button><div class="project-dialog-inner"><div id="project-modal-content"></div></div></dialog>

  <footer class="footer" id="site-footer"><div class="shell footer-inner"><span id="footer-left">© <span id="year">2026</span> Than Bannarat</span><span id="footer-right">Built with HTML, CSS &amp; JavaScript · Managed with Git</span></div></footer>
  <script src="data/portfolio-data.js"></script>
  <script src="portfolio.js"></script>
</body>
</html>
